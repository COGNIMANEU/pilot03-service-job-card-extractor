name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'

jobs:
  # Ruff only needs the pinned dev tools, so it skips the heavy runtime lock.
  lint:
    name: Python - Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools from the lockfile
        run: python -m pip install --no-deps --require-hashes -r requirements-dev.lock

      - name: Run ruff
        run: ruff check .

  test:
    name: Python - Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # No native libraries needed: pypdfium2 and zxing-cpp ship self-contained wheels.
      - name: Install dependencies from the lockfiles
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --require-hashes -r requirements-dev.lock

      - name: Run tests
        run: python -m pytest tests/ -q
