[project]
name = "job-card-extractor"
version = "1.1.0"
description = "CLI tool for extracting job numbers and operations from manufacturing job card PDFs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13,<3.14"
# Keep in sync with requirements.txt (tests/test_dependency_manifests.py checks
# this). requirements.lock is compiled from these; see docs/development.md.
dependencies = [
    "numpy>=1.19.0",
    "opencv-python>=4.5.0",
    "Pillow>=8.0.0",
    "pdf2image>=1.16.0",
    "pyzbar>=0.1.8",
    "easyocr>=1.4.1",
    "torch>=1.7.0",
    "torchvision>=0.8.0",
]
