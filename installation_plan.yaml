target: job-card-extractor
version: "1.1.0"
description: CLI tool for extracting job numbers and operations from manufacturing job card PDFs

phases:
  - id: python-env
    name: Setup Python environment
    steps:
      - action: check-python
        description: Verify Python 3.13+ is available
      - action: create-venv
        description: Create virtual environment at ~/.venv/job-card-extractor
      - action: install-deps
        description: Install Python dependencies from requirements.lock (hash-verified; falls back to requirements.txt): numpy, opencv, Pillow, pypdfium2, zxing-cpp, easyocr, torch, torchvision

  - id: verify
    name: Verify installation
    steps:
      - action: check-python-packages
        description: Verify all Python packages are importable (cv2, easyocr, zxingcpp, pypdfium2)

rollback:
  - Remove virtual environment: rm -rf ~/.venv/job-card-extractor

verification:
  Python: python3 -c "import cv2, easyocr, zxingcpp, pypdfium2; print('All packages ready')"

platform_support:
  # No system dependencies: pypdfium2 and zxing-cpp ship self-contained wheels.
  macos:
    package_manager: brew
    deps: none
  linux:
    package_manager: apt/dnf/yum/pacman/zypper
    deps: none
  windows:
    package_manager: winget/choco
    script: install.ps1
